# Configuração comum a TODOS os modelos.
# Cada configs/<modelo>.yaml só sobrescreve o que muda — assim a comparação é justa:
# mesmos dados, mesmo pré-processamento, mesmo loop de treino.

dados:
  dataset: speech_commands_v2
  # gsc35: as 35 palavras (necessária para AudioMNIST e MSWC-pt)
  # gsc12: 10 comandos + _unknown_ + _silence_ (padrão Hello Edge/KWT, comparável aos artigos)
  # n_classes é calculado a partir da tarefa
  tarefa: gsc35
  sample_rate: 16000
  duracao_s: 1.0
  # MFCC "padrao": 40 coef, janela 30 ms, passo 10 ms, center -> entrada (B, 40, 101)
  # Preset "hello_edge" (configs.PRESETS_MFCC): 10 coef, 40 ms, 20 ms, sem center -> (B, 10, 49)
  n_mfcc: 40
  janela_ms: 30
  passo_ms: 10
  center: true
  n_mels: 40
  f_min: 20
  f_max: 7600
  # global: média/desvio por coeficiente medidos no TREINO | por_amostra: cada áudio pela sua própria média/desvio
  normalizacao: global
  spec_augment: true        # máscara de tempo e de coeficientes, igual para todos

treino:
  epocas: 20
  batch_size: 128
  learning_rate: 0.003
  weight_decay: 0.01
  otimizador: adamw
  scheduler: onecycle
  label_smoothing: 0.1
  seeds: [0, 1, 2]          # 3 rodadas independentes para média ± desvio
  num_workers: 0            # MFCC já está em memória: processos extras só adicionam overhead

avaliacao:
  latencia_repeticoes: 300
  latencia_aquecimento: 30
  latencia_threads: 1       # simula um dispositivo restrito (1 núcleo)
  snrs_db: [20, 10, 5, 0, -5]
